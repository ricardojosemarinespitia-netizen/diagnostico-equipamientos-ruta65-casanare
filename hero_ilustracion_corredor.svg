<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="hc-t hc-d" style="width:100%;height:auto;display:block">
  <title id="hc-t">Corredor Ruta 65 — Casanare</title>
  <desc id="hc-d">Plano esquemático y perfil longitudinal real (SRTM 30 m) del corredor Ruta 65 que conecta Yopal, Aguazul, Monterrey, Sabanalarga, Tauramena y Villanueva.</desc>
  <defs>
    <pattern id="hc-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4A7FA7" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <pattern id="hc-grid-l" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#4A7FA7" stroke-opacity=".3" stroke-width="1"/>
    </pattern>
    <linearGradient id="hc-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A7FA7" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1A3D63" stop-opacity=".05"/>
    </linearGradient>
    <style>
      .hc-lab{font:600 21px/1 'Inter','Segoe UI',system-ui,sans-serif;fill:#F6FAFD;letter-spacing:.02em}
      .hc-km{font:500 14px/1 ui-monospace,'Consolas',monospace;fill:#B3CFE5;fill-opacity:.8;letter-spacing:.06em}
      .hc-ab{display:none;font:700 46px/1 'Inter','Segoe UI',system-ui,sans-serif;fill:#F6FAFD}
      @media (max-width:640px){.hc-lab,.hc-km,.hc-tag,.hc-sc{display:none}.hc-ab{display:inline}}
      .hc-tag{font:600 14px/1 ui-monospace,'Consolas',monospace;fill:#B3CFE5;letter-spacing:.14em}
    </style>
  </defs>

  <!-- retícula -->
  <rect width="1200" height="520" fill="url(#hc-grid)"/>
  <rect width="1200" height="520" fill="url(#hc-grid-l)"/>

  <!-- ===== PLANTA ===== -->
  <text class="hc-tag" x="60" y="44">PLANTA · CORREDOR RUTA 65</text>
  <line x1="60" y1="54" x2="300" y2="54" stroke="#B3CFE5" stroke-opacity=".5"/>

  <!-- ríos esquemáticos -->
  <g fill="none" stroke="#4A7FA7" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="2 5">
    <path d="M250 60 C270 140 230 220 300 300"/>
    <path d="M560 60 C590 150 540 230 600 300"/>
    <path d="M880 60 C850 140 910 220 870 300"/>
  </g>

  <!-- buffer del corredor -->
  <path d="M110 220 C220 160 300 150 380 170 S560 230 640 200 S820 120 900 150 S1060 220 1110 190"
        fill="none" stroke="#4A7FA7" stroke-opacity=".18" stroke-width="44" stroke-linecap="round"/>
